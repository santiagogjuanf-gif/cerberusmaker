<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — CerberusMaker</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #0D0D0D;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #F0F0F0;
    }
    .box {
      background: #161616;
      border: 1px solid #2A2A2A;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 360px;
      position: relative;
    }
    .box::before {
      content: '';
      position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 50%; height: 1px;
      background: linear-gradient(90deg, transparent, #FF6B1A, transparent);
    }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    p { font-size: 13px; color: #666; margin-bottom: 28px; }
    label { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #888; margin-bottom: 8px; }
    input[type="password"] {
      width: 100%; padding: 12px 16px;
      background: #0D0D0D; border: 1px solid #2A2A2A;
      border-radius: 8px; color: #F0F0F0;
      font-family: inherit; font-size: 15px;
      outline: none; transition: border-color 0.2s;
    }
    input[type="password"]:focus { border-color: #FF6B1A; }
    .error { font-size: 12px; color: #FF6B1A; margin-top: 8px; }
    button {
      margin-top: 20px; width: 100%; padding: 13px;
      background: #FF6B1A; color: #0D0D0D;
      border: none; border-radius: 8px;
      font-family: inherit; font-size: 14px; font-weight: 700;
      letter-spacing: 0.05em; cursor: pointer;
      transition: box-shadow 0.2s, transform 0.15s;
    }
    button:hover { box-shadow: 0 0 24px rgba(255,107,26,0.5); transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="box">
    <h1>Admin Panel</h1>
    <p>CerberusMaker — Link management</p>
    <form method="POST" action="/admin/login">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autofocus autocomplete="current-password" required>
      <div id="err" class="error" style="display:none">Incorrect password</div>
      <button type="submit">Sign in</button>
    </form>
  </div>
  <script>
    if (location.search.includes('error=1')) {
      document.getElementById('err').style.display = 'block';
    }
  </script>
</body>
</html>
