<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CerberusMaker — Coming Soon</title>
  <link rel="icon" href="/logo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #FF6B1A;
      --bg: #0D0D0D;
      --text: #F0F0F0;
      --muted: #666;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
      background-image:
        linear-gradient(rgba(255,107,26,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,107,26,0.03) 1px, transparent 1px);
      background-size: 36px 36px;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 55vh;
      background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(255,107,26,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .content {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      max-width: 520px;
      width: 100%;
    }

    .logo-wrap {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 2px solid rgba(255,107,26,0.25);
      box-shadow: 0 0 48px rgba(255,107,26,0.2), 0 0 96px rgba(255,107,26,0.06);
      overflow: hidden;
      margin-bottom: 32px;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(32px, 7vw, 52px);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 20px;
      color: #fff;
    }

    h1 span {
      color: var(--orange);
    }

    .description {
      font-size: 16px;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 52px;
      max-width: 400px;
    }

    .progress-wrap {
      width: 100%;
      max-width: 380px;
      margin-bottom: 12px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .progress-bar {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,0.06);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--orange), #FFB347);
      border-radius: 3px;
      width: 0%;
      animation: progress 3.5s ease-out forwards;
      box-shadow: 0 0 12px rgba(255,107,26,0.6);
    }

    @keyframes progress {
      0%   { width: 0%; }
      40%  { width: 55%; }
      70%  { width: 72%; }
      90%  { width: 85%; }
      100% { width: 85%; }
    }

    .tagline {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #3A3A3A;
      margin-top: 64px;
    }

    .tagline span {
      color: #444;
    }

    /* Animated dots in corner */
    .corner-dots {
      position: fixed;
      bottom: 32px;
      right: 32px;
      display: flex;
      gap: 6px;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--orange);
      opacity: 0.3;
      animation: blink 1.4s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.15; }
      40% { opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div class="content">
    <div class="logo-wrap">
      <img src="/logo.png" alt="CerberusMaker">
    </div>

    <div class="brand">CerberusMaker</div>

    <h1>Something<br><span>powerful</span><br>is coming.</h1>

    <p class="description">
      We're building the ultimate 3D printing shop.<br>
      Custom pieces, prototypes &amp; accessories — crafted layer by layer.
    </p>

    <div class="progress-wrap">
      <div class="progress-label">
        <span>Building...</span>
        <span id="pct">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="fill"></div>
      </div>
    </div>

    <div class="tagline">
      Create <span>·</span> Print <span>·</span> Build
    </div>
  </div>

  <div class="corner-dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <script>
    // Animate the percentage counter to match the CSS progress bar
    const pct = document.getElementById('pct');
    const targets = [
      { time: 0,    val: 0   },
      { time: 1400, val: 55  },
      { time: 2450, val: 72  },
      { time: 3150, val: 85  },
    ];
    let step = 0;
    function tick() {
      if (step >= targets.length - 1) return;
      const from = targets[step];
      const to = targets[step + 1];
      const duration = to.time - from.time;
      const start = performance.now();
      function frame(now) {
        const t = Math.min((now - start) / duration, 1);
        const ease = 1 - Math.pow(1 - t, 3);
        pct.textContent = Math.round(from.val + (to.val - from.val) * ease) + '%';
        if (t < 1) requestAnimationFrame(frame);
        else { step++; setTimeout(tick, 0); }
      }
      requestAnimationFrame(frame);
    }
    setTimeout(tick, 0);
  </script>
</body>
</html>
