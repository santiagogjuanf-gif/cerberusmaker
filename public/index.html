<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CerberusMaker</title>
  <link rel="icon" href="/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #FF6B1A;
      --orange-dim: rgba(255, 107, 26, 0.12);
      --orange-glow: 0 0 32px rgba(255, 107, 26, 0.4);
      --bg: #0D0D0D;
      --card: #161616;
      --border: #2A2A2A;
      --text: #F0F0F0;
      --muted: #888;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background-image:
        linear-gradient(rgba(255,107,26,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,107,26,0.03) 1px, transparent 1px);
      background-size: 36px 36px;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 50vh;
      background: radial-gradient(ellipse 70% 40% at 50% 0%, rgba(255,107,26,0.07) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 60%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--orange), transparent);
    }

    .logo-wrap {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 2px solid rgba(255,107,26,0.3);
      box-shadow: var(--orange-glow);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      margin-bottom: 20px;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 6px;
    }

    .brand-name span {
      color: var(--orange);
    }

    .tagline {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 36px;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      list-style: none;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px 20px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      color: var(--text);
      transition: all 0.22s ease;
      cursor: pointer;
    }

    .link-btn:hover {
      background: var(--orange-dim);
      border-color: rgba(255,107,26,0.45);
      box-shadow: var(--orange-glow);
      transform: translateY(-2px);
    }

    .link-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--orange-dim);
      border: 1px solid rgba(255,107,26,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--orange);
    }

    .link-icon svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .link-text {
      flex: 1;
    }

    .link-label {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      display: block;
    }

    .link-sublabel {
      font-size: 12px;
      color: var(--muted);
      display: block;
      margin-top: 2px;
    }

    .link-arrow {
      color: var(--muted);
      font-size: 18px;
      transition: color 0.2s;
    }

    .link-btn:hover .link-arrow {
      color: var(--orange);
    }

    .footer {
      margin-top: 28px;
      font-size: 11px;
      color: #444;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .footer a {
      color: #555;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="/logo.png" alt="CerberusMaker Logo">
    </div>
    <div class="brand-name"><span>Cerberus</span>Maker</div>
    <div class="tagline">Create &middot; Print &middot; Build</div>
    <ul class="links" id="links-list"></ul>
  </div>
  <div class="footer">
    <a href="https://cerberusmaker.com">cerberusmaker.com</a>
  </div>

  <script>

    };

    async function loadLinks() {
      const res = await fetch('/api/links');
      const links = await res.json();
      const list = document.getElementById('links-list');
      list.innerHTML = links.map(link => `
        <li>
          <a class="link-btn" href="${link.url}" target="_blank" rel="noopener">
            <div class="link-icon">${icons[link.icon] || icons.link}</div>
            <div class="link-text">
              <span class="link-label">${link.label}</span>
              ${link.sublabel ? `<span class="link-sublabel">${link.sublabel}</span>` : ''}
            </div>
            <span class="link-arrow">›</span>
          </a>
        </li>
      `).join('');
    }

    loadLinks();
  </script>
</body>
</html>
